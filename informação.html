<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links para Baixar Arquivos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-image: url('12.jpeg');
            
            color: #333;
            text-align: center;
            padding: 50px;
        }

        h1 {
            color: #007bff;
            font-size: 2em;
        }

        .download-link {
            display: block;
            background-color: #2f21f5;
            color: white;
            padding: 15px 20px;
            margin: 10px 0;
            border-radius: 5px;
            text-decoration: none;
            font-size: 1.2em;
            transition: background-color 0.3s ease;
        }

        .download-link:hover {
            background-color: #e01616;
        }

        .download-link:active {
            background-color: #f11111;
        }
    </style>
</head>
<body>

    <h1>Links para Baixar Arquivos-2025</h1>
    
    <!-- Link para baixar o PDF -->
    <a href="HORÁRIO DEF. 2.xlsx" download="BicudoDigital-main/HORÁRIO DEF. 2.xlsx" class="download-link">
        Baixar Horario Escolar
    </a>

    <!-- Link para baixar uma Imagem -->
    <a href="MAPA ESCOLA (1).docx" download="BicudoDigital-main/MAPA ESCOLA (1).docx" class="download-link">
        Baixar Mapa Escolar
    </a>

    <!-- Link para baixar um arquivo de Texto -->
    <a href="MAPA ESCOLA DESENHO.docx" download="BicudoDigital-main/MAPA ESCOLA DESENHOI.docx" class="download-link">
        Baixar Mapa Desenho
    </a>

</body>
</html>
